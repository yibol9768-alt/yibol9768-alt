name: Update merged contributions

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_contributions.py
      - .github/workflows/update-contributions.yml

permissions:
  contents: write

concurrency:
  group: update-profile-contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Refresh merged upstream PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_contributions.py
      - name: Commit changes when needed
        run: |
          if git diff --quiet -- README.md; then
            echo "Contributions are already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: refresh merged upstream contributions'
          git push
